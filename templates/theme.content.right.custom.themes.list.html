{{#each customThemes}}
<div class="compact-actions no-padding{{#if @last}} last{{/if}}" data-margin="60,3,0,0">

	<div class="compact-actions-name">
		<span>{{name}}</span>
	</div>

	<div class="compact-actions-button">
		<div class="switch{{#if active}} a{{/if}}" on="theme.activeCustomTheme({{@key}}, true)" off="theme.activeCustomTheme({{@key}}, false)">
			<div></div>
			<svg viewBox="0 0 52 32"><path d="M 8,0 C 3.58,0 0,3.58 0,8 0,12.42 3.58,16 8,16 8,16 8,16 8,16 12.42,16 16,12.42 16,8 16,3.58 12.42,0 8,0 8,0 8,0 8,0 Z"></path></svg>
		</div>
	</div>

	<div class="compact-actions-buttons compact-actions-buttons-horizontal">
		<i class="material-icon" onclick="theme.editCustomTheme({{@key}});">edit</i>
		<i class="material-icon" onclick="theme.removeCustomTheme({{@key}});">close</i>
	</div>

</div>
{{/each}}
