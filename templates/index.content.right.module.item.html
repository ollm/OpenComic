<div class="sha-{{sha}} gamepad-item{{#if @first}}{{#unless noHighlight}} gamepad-to-highlight{{/unless}}{{/if}} hover-text file-item" onclick="{{#if folder}}dom.loadIndexPage(true, '{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}', false, false, '{{chain 'escapeBackSlash' 'escapeQuotesSimples' mainPath}}');{{else}}dom.openComic(true, '{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}', '{{chain 'escapeBackSlash' 'escapeQuotesSimples' mainPath}}');{{/if}}{{onclick}}" oncontextmenu="dom.contextMenu.show.call(this, fromGamepad)" onmousedown="tabs.middleClickOpen(event, '{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}', '{{chain 'escapeBackSlash' 'escapeQuotesSimples' mainPath}}')" data-type="{{#if folder}}folder{{else}}image{{/if}}" data-path="{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}" data-main-path="{{chain 'escapeBackSlash' 'escapeQuotesSimples' mainPath}}" data-from-index="{{#if @root.comicsIndex}}{{#unless fromRecentlyOpened}}1{{else}}0{{/unless}}{{else}}0{{/if}}" data-from-index-not-master-folders="{{#if @root.comicsIndex}}{{#unless fromMasterFolder}}1{{else}}0{{/unless}}{{else}}0{{/if}}" hover-text="{{name}}" data-hover-detect-overflow=".v-text" data-hover-margin="-20,0,0,0" data-hover-delay="600" >
	{{#if folder}}
	<div{{#if @root.page.fadeCompleted}}{{#if progress.completed}} style="opacity: 0.3;"{{/if}}{{/if}}>
		<div class="v-folder item-image">
			{{#if poster}}
				<div class="folder-poster">
					<img{{#if poster.path}} class="has-poster" src="{{poster.path}}"{{else}} class="sha-image-{{poster.sha}} folder-poster-img"{{/if}}>
				</div>
				{{#if images}}
					{{#each images}}
					<div class="folder-images">
						<img class="sha-image-{{sha}}" src="{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}">
					</div>
					{{/each}}
				{{/if}}
			{{else}}
				{{#each images}}
				<div class="folder-images">
					<img class="sha-image-{{sha}}" src="{{chain 'escapeBackSlash' 'escapeQuotesSimples' path}}">
				</div>
				{{/each}}
			{{/if}}
		</div>
		{{#if poster}}
		<div class="progress-pages{{#if progress}} show{{/if}}">
			<svg>
				<text{{#unless @root.page.progressPages}} style="opacity: 0;"{{/unless}}>
					<textPath href="#progress-pages-{{#if parent.size}}{{parent.size}}{{else}}{{@root.page.viewModuleSize}}{{/if}}" startoffset="0">{{progress.read}} / {{progress.total}}</textPath>
					<textPath href="#progress-pages-{{#if parent.size}}{{parent.size}}{{else}}{{@root.page.viewModuleSize}}{{/if}}" startoffset="0">{{progress.read}} / {{progress.total}}</textPath>
				</text>
				<text{{#unless @root.page.progressPercent}} style="opacity: 0;"{{/unless}}>
					<textPath href="#progress-pages-{{#if parent.size}}{{parent.size}}{{else}}{{@root.page.viewModuleSize}}{{/if}}" startoffset="2">{{progress.percentRound}}%</textPath>
					<textPath href="#progress-pages-{{#if parent.size}}{{parent.size}}{{else}}{{@root.page.viewModuleSize}}{{/if}}" startoffset="2">{{progress.percentRound}}%</textPath>
				</text>
			</svg>
		</div>
		{{/if}}
		{{#if @root.page.progressBar}}
		<div class="progress-bar{{#if progress}} show{{/if}}">
			<span style="transform: translateX(calc(-100% + {{progress.percent}}%))"></span>
		</div>
		{{/if}}
	</div>
	{{else}}
	<div class="v-img">
		<picture><img class="sha-image-{{sha}} item-image{{#if thumbnail}} border{{/if}}" src="{{chain 'escapeBackSlash' 'escapeQuotesSimples' thumbnail}}"></picture>
	</div>
	{{/if}}
	<div class="v-text body-small">{{name}}</div>
	{{#if subname}}<div class="v-secondary-text body-small">{{subname}}</div>{{/if}}
</div>
